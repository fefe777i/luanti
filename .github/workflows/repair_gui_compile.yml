name: One-shot GUI compile repair

on:
  push:
    branches: [workshop47-multiworld]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply source fixes
        run: |
          set -e
          sed -i '/^class IShaderSource;$/a\
\
namespace irr {\
namespace scene {\
class ISceneManager;\
}\
}\
' src/gui/guiFormSpecMenu.h
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/gui/guiFormSpecMenu.cpp')
          s = p.read_text()
          old = '''scene::IAnimatedMesh *mesh = m_client ?
\t\t\tm_client->getMesh(meshstr) :
\t\t\tmodel_smgr->getMesh(meshstr.c_str());'''
          new = '''scene::IAnimatedMesh *mesh = nullptr;
\tif (m_client) {
\t\tmesh = m_client->getMesh(meshstr);
\t} else {
\t\tio::IReadFile *file = RenderingEngine::get_raw_device()->getFileSystem()->createAndOpenFile(meshstr.c_str());
\t\tif (file) {
\t\t\tmesh = model_smgr->getMesh(file);
\t\t\tfile->drop();
\t\t}
\t}'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'model_smgr->getMesh(meshstr.c_str())' in s:
              raise SystemExit('unexpected model mesh formatting')
          PY
          grep -q 'namespace scene' src/gui/guiFormSpecMenu.h
          grep -q 'createAndOpenFile(meshstr.c_str())' src/gui/guiFormSpecMenu.cpp

      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair_gui_compile.yml
          git add src/gui/guiFormSpecMenu.h src/gui/guiFormSpecMenu.cpp .github/workflows/repair_gui_compile.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix GUI model compile errors'
          git push
