name: One-shot GUI compile repair

on:
  push:
    branches: [workshop47-multiworld]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair GUI model compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          h = Path('src/gui/guiFormSpecMenu.h')
          s = h.read_text()
          if 'class ISceneManager;' not in s:
              marker = 'class IShaderSource;\n'
              s = s.replace(marker, marker + '\nnamespace irr {\nnamespace scene {\nclass ISceneManager;\n}\n}\n')
          h.write_text(s)

          cpp = Path('src/gui/guiFormSpecMenu.cpp')
          s = cpp.read_text()
          pattern = re.compile(
              r'scene::IAnimatedMesh\s*\*mesh\s*=\s*m_client\s*\?\s*'
              r'm_client->getMesh\(meshstr\)\s*:\s*'
              r'model_smgr->getMesh\(meshstr\.c_str\(\)\);',
              re.S,
          )
          new = '''scene::IAnimatedMesh *mesh = nullptr;
\tif (m_client) {
\t\tmesh = m_client->getMesh(meshstr);
\t} else {
\t\tio::IReadFile *file = RenderingEngine::get_raw_device()->getFileSystem()->createAndOpenFile(meshstr.c_str());
\t\tif (file) {
\t\t\tmesh = model_smgr->getMesh(file);
\t\t\tfile->drop();
\t\t}
\t}'''
          s, count = pattern.subn(new, s, count=1)
          if count != 1:
              raise SystemExit('model mesh block not found')
          cpp.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair_gui_compile.yml
          git add src/gui/guiFormSpecMenu.h src/gui/guiFormSpecMenu.cpp .github/workflows/repair_gui_compile.yml
          git commit -m 'Fix GUI model compile errors'
          git push

# Triggered with a forward declaration and file-based mesh loading.
