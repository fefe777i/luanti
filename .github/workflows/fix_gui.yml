name: Fix GUI compile

on:
  push:
    branches:
      - workshop47-multiworld

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix source
        run: |
          set -e
          sed -i '/^class IShaderSource;$/a\
namespace irr {\
namespace scene {\
class ISceneManager;\
}\
}\
' src/gui/guiFormSpecMenu.h
          python3 -c 'from pathlib import Path; p=Path("src/gui/guiFormSpecMenu.cpp"); s=p.read_text(); old="scene::IAnimatedMesh *mesh = m_client ?\\n\\t\\t\\tm_client->getMesh(meshstr) :\\n\\t\\t\\tmodel_smgr->getMesh(meshstr.c_str());"; new="scene::IAnimatedMesh *mesh = nullptr;\\n\\tif (m_client) {\\n\\t\\tmesh = m_client->getMesh(meshstr);\\n\\t} else {\\n\\t\\tio::IReadFile *file = RenderingEngine::get_raw_device()->getFileSystem()->createAndOpenFile(meshstr.c_str());\\n\\t\\tif (file) {\\n\\t\\t\\tmesh = model_smgr->getMesh(file);\\n\\t\\t\\tfile->drop();\\n\\t\\t}\\n\\t}"; assert old in s; p.write_text(s.replace(old,new,1))'
          grep -q 'namespace scene' src/gui/guiFormSpecMenu.h
          grep -q 'createAndOpenFile(meshstr.c_str())' src/gui/guiFormSpecMenu.cpp
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix_gui.yml .github/workflows/repair_gui_compile.yml
          git add src/gui/guiFormSpecMenu.h src/gui/guiFormSpecMenu.cpp .github/workflows/fix_gui.yml .github/workflows/repair_gui_compile.yml
          git commit -m 'Fix GUI model compile errors'
          git push
