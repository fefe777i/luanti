name: android

on:
  push:
    branches: [workshop47, workshop47-multiworld]
  pull_request:
    branches: [workshop47, workshop47-multiworld]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply Multiworld
        run: |
          bash apply_multiworld.sh
          bash apply_multiworld_mapdb.sh
          bash apply_multiworld_serverdb.sh
      - name: Repair GUI compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          h = Path('src/gui/guiFormSpecMenu.h')
          s = h.read_text()
          bad = 'namespace irr {\nnamespace scene {\nclass ISceneManager;\n}\n}\n'
          if bad in s:
              s = s.replace(bad, 'namespace scene {\nclass ISceneManager;\n}\n', 1)
          elif 'namespace scene {\nclass ISceneManager;\n}\n' not in s:
              marker = 'class IShaderSource;\n'
              if marker not in s:
                  raise SystemExit('GUI header marker not found')
              s = s.replace(marker, marker + '\nnamespace scene {\nclass ISceneManager;\n}\n', 1)
          h.write_text(s)
          PY
      - name: Repair GUI model loader API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/gui/guiFormSpecMenu.cpp')
          s = p.read_text()
          old = 'scene::IAnimatedMesh *mesh = m_client ?\n\t\t\tm_client->getMesh(meshstr) :\n\t\t\tmodel_smgr->getMesh(meshstr.c_str());'
          new = 'scene::IAnimatedMesh *mesh = m_client ?\n\t\t\tm_client->getMesh(meshstr) : nullptr;'
          if old not in s:
              raise SystemExit('GUI model loader block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Force Android linker to lld
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  try:
                      s = p.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  if '-fuse-ld=gold' in s:
                      p.write_text(s.replace('-fuse-ld=gold', '-fuse-ld=lld'))
          PY
          export LDFLAGS="${LDFLAGS:-} -fuse-ld=lld"
          export CFLAGS="${CFLAGS:-} -fuse-ld=lld"
          export CXXFLAGS="${CXXFLAGS:-} -fuse-ld=lld"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK with Gradle
        run: cd android; ./gradlew assemblerelease
      - name: Save arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luanti-arm64-v8a.apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
