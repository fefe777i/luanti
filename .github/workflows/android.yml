name: android

on:
  push:
    branches: [workshop47]
  pull_request:
    branches: [workshop47]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Repository secrets with the signing key (see the instructions in the chat).
      # Without them the APK is built unsigned and no update is published.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply Multiworld
        run: bash apply_multiworld.sh
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Write build number (the game compares it with update.json)
        run: echo "${{ github.run_number }}" > builtin/ws47_build.txt
      - name: Build APK with Gradle
        run: cd android; ./gradlew assemblerelease
      - name: Save arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luanti-arm64-v8a.apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk

      - name: Sign APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ws47.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p release
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ws47.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out release/Workshop47-arm64-v8a.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs release/Workshop47-arm64-v8a.apk

      - name: Publish release (update.json + APK)
        if: ${{ env.KEYSTORE_BASE64 != '' && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          notes = os.environ.get("COMMIT_MESSAGE", "").strip().splitlines()
          data = {
              "build": int("${{ github.run_number }}"),
              "apk_url": f"https://github.com/{repo}/releases/download/latest/Workshop47-arm64-v8a.apk",
              "notes": notes[0] if notes else "",
          }
          json.dump(data, open("release/update.json", "w"), ensure_ascii=False)
          PY
          cat release/update.json
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release/Workshop47-arm64-v8a.apk release/update.json \
            --target "${{ github.sha }}" \
            --title "Workshop 47 build ${{ github.run_number }}" \
            --notes "Automatic build ${{ github.run_number }}"
