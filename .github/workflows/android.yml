name: android

on:
  push:
    branches: [workshop47, workshop47-multiworld]
  pull_request:
    branches: [workshop47, workshop47-multiworld]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply Multiworld
        run: |
          bash apply_multiworld.sh
          bash apply_multiworld_mapdb.sh
          bash apply_multiworld_serverdb.sh
      - name: Repair GUI compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          h = Path('src/gui/guiFormSpecMenu.h')
          s = h.read_text()
          if 'class ISceneManager;' not in s:
              marker = 'class IShaderSource;\n'
              if marker not in s:
                  raise SystemExit('GUI header marker not found')
              s = s.replace(marker, marker + '\nnamespace irr {\nnamespace scene {\nclass ISceneManager;\n}\n}\n', 1)
              h.write_text(s)

          cpp = Path('src/gui/guiFormSpecMenu.cpp')
          s = cpp.read_text()
          old = '''scene::IAnimatedMesh *mesh = m_client ?
\t\t\tm_client->getMesh(meshstr) :
\t\t\tmodel_smgr->getMesh(meshstr.c_str());'''
          new = '''scene::IAnimatedMesh *mesh = nullptr;
\tif (m_client) {
\t\tmesh = m_client->getMesh(meshstr);
\t} else {
\t\tio::IReadFile *file = RenderingEngine::get_raw_device()->getFileSystem()->createAndOpenFile(meshstr.c_str());
\t\tif (file) {
\t\t\tmesh = model_smgr->getMesh(file);
\t\t\tfile->drop();
\t\t}
\t}'''
          if old in s:
              cpp.write_text(s.replace(old, new, 1))
          elif 'model_smgr->getMesh(meshstr.c_str())' in s:
              raise SystemExit('GUI model mesh call has unexpected formatting')

          cmake = Path('CMakeLists.txt')
          s = cmake.read_text()
          if 'CMAKE_CXX_LINK_OPTIONS_IPO' not in s:
              marker = '''\tif(lto_supported)
\t\tset(CMAKE_INTERPROCEDURAL_OPTIMIZATION TRUE)
\t\tmessage(STATUS "LTO/IPO is enabled")'''
              replacement = '''\tif(lto_supported)
\t\tset(CMAKE_INTERPROCEDURAL_OPTIMIZATION TRUE)

\t\tif(ANDROID)
\t\t\tstring(REPLACE "-fuse-ld=gold" "-fuse-ld=lld" CMAKE_C_LINK_OPTIONS_IPO "${CMAKE_C_LINK_OPTIONS_IPO}")
\t\t\tstring(REPLACE "-fuse-ld=gold" "-fuse-ld=lld" CMAKE_CXX_LINK_OPTIONS_IPO "${CMAKE_CXX_LINK_OPTIONS_IPO}")
\t\tendif()

\t\tmessage(STATUS "LTO/IPO is enabled")'''
              if marker not in s:
                  raise SystemExit('CMake LTO insertion point not found')
              cmake.write_text(s.replace(marker, replacement, 1))
          PY
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK with Gradle
        run: cd android; ./gradlew assemblerelease
      - name: Save arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luanti-arm64-v8a.apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
